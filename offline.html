<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline — Football English Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 24px;
            opacity: 0.7;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 12px;
            color: #f1f5f9;
        }
        p {
            font-size: 1rem;
            color: #94a3b8;
            max-width: 320px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .retry-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px 36px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .retry-btn:active { transform: scale(0.95); }
        .badge {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #475569;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>You're Offside.</h1>
    <p>No internet connection detected. Check your network and try again — The Gaffer is waiting.</p>
    <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
    <p class="badge">FOOTBALL ENGLISH ACADEMY • GAFFER PRO</p>
</body>
</html>
