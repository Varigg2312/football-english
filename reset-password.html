<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Football English Academy</title>
    <script src="i18n.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card { width: 100%; max-width: 380px; text-align: center; }
        .lang-select {
            position: fixed; top: 16px; right: 16px;
            background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
            border-radius: 8px; padding: 6px 10px; font-size: 0.85rem;
        }
        h1 { font-size: 1.4rem; font-weight: 900; margin-bottom: 8px; color: #f1f5f9; }
        .subtitle { font-size: 0.95rem; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
        input {
            width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 8px;
            margin-bottom: 14px; background: #1e293b; color: #f1f5f9; font-size: 1rem;
        }
        .cta-btn {
            width: 100%; background: #3b82f6; color: white; border: none;
            padding: 13px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer;
        }
        .cta-btn:disabled { opacity: 0.6; cursor: default; }
        .error-msg { color: #f87171; font-size: 0.85rem; margin-top: 12px; }
        .icon { font-size: 3rem; margin-bottom: 16px; }
        .home-link { display: inline-block; margin-top: 20px; color: #3b82f6; text-decoration: none; font-weight: 600; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <select id="lang-selector" class="lang-select" aria-label="Language">
        <option value="en">🌍 EN</option>
        <option value="es">🇪🇸 ES</option>
    </select>

    <div class="card" id="form-state">
        <h1 data-i18n="resetpw.title">Reset Your Password</h1>
        <p class="subtitle" data-i18n="resetpw.subtitle">Choose a new password for your account.</p>
        <input type="password" id="new-password"
               data-i18n-placeholder="resetpw.new_password_placeholder"
               placeholder="New password" autocomplete="new-password">
        <input type="password" id="confirm-password"
               data-i18n-placeholder="resetpw.confirm_password_placeholder"
               placeholder="Confirm new password" autocomplete="new-password">
        <button class="cta-btn" id="submit-btn" data-i18n="resetpw.submit">Reset Password</button>
        <p id="form-msg" class="error-msg"></p>
    </div>

    <div class="card hidden" id="success-state">
        <div class="icon">✅</div>
        <h1 data-i18n="resetpw.success_title">Password Updated!</h1>
        <p class="subtitle" data-i18n="resetpw.success_msg">You can now sign in with your new password.</p>
        <a href="/" class="home-link" data-i18n="resetpw.back_home">Back to the Academy</a>
    </div>

    <div class="card hidden" id="invalid-state">
        <div class="icon">⚠️</div>
        <h1 data-i18n="resetpw.invalid_title">Link Expired or Invalid</h1>
        <p class="subtitle" data-i18n="resetpw.invalid_msg">This password reset link is no longer valid. Request a new one from the sign-in screen.</p>
        <a href="/" class="home-link" data-i18n="resetpw.back_home">Back to the Academy</a>
    </div>

    <script src="reset-password.js"></script>
</body>
</html>
